<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Infinity Scroll of Forever</title>

    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;600&family=Dancing+Script:wght@700&family=Pacifico&family=Montserrat:wght@400;700&family=Great+Vibes&family=Cinzel:wght@700&family=Poppins:wght@300;400;600&family=Cormorant+Garamond:ital,wght@1,600&family=Lobster&family=Sacramento&family=Mrs+Saint+Delafield&display=swap"
        rel="stylesheet" />

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7e0c23",
                        "rosegold": "#B76E79",
                        "rose-900": "#4c0519",
                        "rose-800": "#9f1239",
                        "background-light": "#f8f6f6",
                        "background-dark": "#211114",
                    },
                    fontFamily: {
                        "display": ["Cinzel", "serif"],
                        "sans": ["Cormorant Garamond", "serif"],
                        "dancing": ["Dancing Script", "cursive"],
                        "cursive": ["Mrs Saint Delafield", "cursive"],
                    },
                },
            },
        }
    </script>

    <style>
        /* Base Styling - Background will be set by JavaScript from CONFIG */
        :root {
            --page-bg: linear-gradient(135deg, #fadceb 0%, #fef3e2 50%, #e0e7ff 100%);
        }

        body {
            background: var(--page-bg);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Film Grain Overlay */
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.04;
            background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDKGknlB-KxaIGCLnTlbc4Nl4TkEFPgcawululOaTjrPN1TjAXh5-VF4xHrr9ynM5yX31NDpYR9RHV2UmbTm20_2PelSIGaLyd6umPnVXMyK5b2UtcHLG3b7jdMErP-Ln0xg5L0HyGn5OoJ1P4RzpWNxI46kDviC-kSSVyGCXAzO7mApHsoqMZkysiUBK5Dw6oeM04dK5WKl4LGHCmneeyiRbiz0D6NcA8NpUWZPs19QE-FuTH8tKsNYadHZHpxk8bnqYdtBBXl9b34");
        }

        /* Floating Dust Particles */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0.3;
            }

            50% {
                transform: translateY(-20px) translateX(10px) rotate(180deg);
                opacity: 0.6;
            }
        }

        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, #fecdd3 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: float 8s infinite ease-in-out;
        }

        /* Ethereal Rose Petals */
        .rose-petal {
            position: fixed;
            pointer-events: none;
            will-change: transform;
            transition: transform 0.1s linear;
        }

        .rose-petal svg {
            width: 100%;
            height: 100%;
        }

        .petal-layer-far {
            z-index: 0;
            opacity: 0.3;
            filter: blur(1px);
        }

        .petal-layer-mid {
            z-index: 2;
            opacity: 0.5;
            filter: blur(0.5px);
        }

        .petal-layer-near {
            z-index: 45;
            opacity: 0.25;
            filter: blur(3px);
        }

        @keyframes petalDrift {

            0%,
            100% {
                transform: translateX(0) rotate(0deg);
            }

            25% {
                transform: translateX(15px) rotate(10deg);
            }

            75% {
                transform: translateX(-15px) rotate(-10deg);
            }
        }

        /* Magical Fade-in Animation for Reasons */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reason-item {
            animation: fadeInUp 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
        }

        /* Photo Memory Reveal Animation */
        @keyframes photoReveal {
            from {
                opacity: 0;
                transform: scale(0.85) rotate(-2deg);
                filter: blur(8px);
            }

            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
                filter: blur(0);
            }
        }

        .photo-memory {
            animation: photoReveal 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }

        /* Polaroid Frame Effect */
        .polaroid-frame {
            background: white;
            padding: 20px 20px 60px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 0 1px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .polaroid-caption {
            font-family: 'Dancing Script', cursive;
            color: #1e293b;
            font-size: 1.25rem;
            text-align: center;
            margin-top: 15px;
        }

        /* Milestone Floating Text */
        @keyframes floatMilestone {

            0%,
            100% {
                transform: translateY(0) scale(1);
                opacity: 0.9;
            }

            50% {
                transform: translateY(-10px) scale(1.02);
                opacity: 1;
            }
        }

        .milestone-text {
            animation: floatMilestone 4s infinite ease-in-out;
            text-shadow: 0 4px 20px rgba(126, 12, 35, 0.3);
        }

        /* Shimmer Effect for Special Elements */
        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }

            100% {
                background-position: 1000px 0;
            }
        }

        .shimmer-text {
            background: linear-gradient(90deg,
                    #7e0c23 0%,
                    #B76E79 50%,
                    #7e0c23 100%);
            background-size: 1000px 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s infinite linear;
        }

        /* Scroll Indicator */
        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(10px);
            }
        }

        .scroll-indicator {
            animation: bounce 2s infinite;
        }

        /* Washi Tape Decoration */
        .washi-tape {
            background: rgba(244, 212, 218, 0.5);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(1px);
        }

        .reason-card-number {
            position: absolute;
            top: 15px;
            right: 18px;
            font-family: 'Cinzel', serif;
            font-size: 0.5rem;
            font-weight: 700;
            color: rgba(126, 12, 35, 0.12);
            letter-spacing: 0.1em;
            pointer-events: none;
        }

        /* Auto Scroll Button */
        .auto-scroll-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.2);
            /* Very transparent */
            color: rgba(126, 12, 35, 0.4);
            /* Subtle text */
            border: 1px solid rgba(126, 12, 35, 0.05);
            padding: 10px 20px;
            border-radius: 99px;
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(126, 12, 35, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.1em;
            backdrop-filter: blur(10px);
        }

        .auto-scroll-btn:hover {
            transform: translateY(-3px);
            background: rgba(126, 12, 35, 0.1);
            color: rgba(126, 12, 35, 0.8);
            border-color: rgba(126, 12, 35, 0.2);
            box-shadow: 0 8px 20px rgba(126, 12, 35, 0.1);
        }

        .auto-scroll-btn.active {
            background: rgba(126, 12, 35, 0.6);
            /* Semi-transparent active state */
            color: white;
            border-color: rgba(126, 12, 35, 0.2);
            box-shadow: 0 5px 15px rgba(126, 12, 35, 0.2);
        }

        .auto-scroll-btn .material-symbols-outlined {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .auto-scroll-btn.active .material-symbols-outlined {
            animation: pulse-slow 2s infinite ease-in-out;
        }

        @keyframes pulse-slow {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        /* Music Toggle Button - ENHANCED FOR MOBILE */
        .music-toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            /* Very high z-index to ensure visibility */
            background: rgba(255, 255, 255, 0.9);
            color: rgba(126, 12, 35, 0.8);
            border: 2px solid rgba(126, 12, 35, 0.3);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(126, 12, 35, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-tap-highlight-color: transparent;
            /* Remove tap highlight on mobile */
            touch-action: manipulation;
            /* Better touch response */
        }

        /* Attention-grabbing animation when music is OFF */
        .music-toggle-btn:not(.playing) {
            animation: attentionPulse 1.5s infinite ease-in-out;
        }

        @keyframes attentionPulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 4px 20px rgba(126, 12, 35, 0.2);
            }

            50% {
                transform: scale(1.1);
                box-shadow: 0 0 30px rgba(126, 12, 35, 0.5);
            }
        }

        .music-toggle-btn:hover,
        .music-toggle-btn:active {
            transform: scale(1.15);
            background: rgba(255, 255, 255, 1);
            color: rgba(126, 12, 35, 1);
            box-shadow: 0 8px 30px rgba(126, 12, 35, 0.3);
        }

        .music-toggle-btn.playing {
            background: rgba(126, 12, 35, 0.85);
            color: white;
            border-color: rgba(126, 12, 35, 0.5);
            animation: musicPulse 2s infinite ease-in-out;
        }

        .music-toggle-btn .material-symbols-outlined {
            font-size: 1.6rem;
            pointer-events: none;
            /* Ensure icon doesn't block clicks */
        }

        @keyframes musicPulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(126, 12, 35, 0.3);
            }

            50% {
                box-shadow: 0 0 0 12px rgba(126, 12, 35, 0);
            }
        }

        /* Video Memory Card Styling */
        .video-memory-card {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 60px auto;
            background: white;
            border-radius: 24px;
            padding: 8px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.15),
                0 0 1px rgba(0, 0, 0, 0.1);
            transform-style: preserve-3d;
            animation: videoCardReveal 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            z-index: 10;
        }

        @keyframes videoCardReveal {
            0% {
                opacity: 0;
                transform: scale(0.8) rotateX(-15deg) translateY(50px);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotateX(0deg) translateY(0);
            }
        }

        .video-memory-card video {
            width: 100%;
            border-radius: 16px;
            display: block;
            background: #000;
        }

        .video-memory-caption {
            text-align: center;
            padding: 16px 20px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            color: #881337;
        }

        /* Play Button Overlay */
        .video-play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            z-index: 12;
        }

        .video-play-overlay:hover {
            transform: translate(-50%, -50%) scale(1.1);
            background: rgba(255, 255, 255, 1);
        }

        .video-play-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .video-play-overlay svg {
            width: 36px;
            height: 36px;
            fill: #881337;
            margin-left: 4px;
            /* Centering trick for play icon */
        }

        /* Video Controls */
        .video-controls {
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 13;
        }

        .video-memory-card:hover .video-controls {
            opacity: 1;
        }

        .video-control-btn {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .video-control-btn:hover {
            transform: scale(1.1);
        }

        .video-progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .video-progress-fill {
            height: 100%;
            background: #ff1493;
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .video-timestamp {
            color: white;
            font-size: 12px;
            font-family: monospace;
            min-width: 80px;
            text-align: center;
        }

        /* Sparkle Effect on Video Appear */
        .video-sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            animation: sparkleFloat 2s ease-out forwards;
        }

        @keyframes sparkleFloat {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0);
            }
        }

        .video-hint {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            z-index: 999;
            animation: fadeInOut 4s ease forwards;
            pointer-events: none;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translate(-50%, -20px);
            }

            15% {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            85% {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
        }

        /* ========================================
           MOBILE START OVERLAY - Required for audio
           ======================================== */
        .start-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: linear-gradient(135deg, rgba(127, 29, 57, 0.97) 0%, rgba(76, 5, 25, 0.99) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .start-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .start-overlay .start-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            border: 3px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: overlayPulse 2s infinite;
        }

        .start-overlay .start-circle:hover,
        .start-overlay .start-circle:active {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.08);
        }

        .start-overlay .start-circle .material-symbols-outlined {
            font-size: 56px;
            color: white;
        }

        .start-overlay h2 {
            color: white;
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            margin-top: 2rem;
            text-align: center;
            letter-spacing: 0.05em;
        }

        .start-overlay p {
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.9rem;
            margin-top: 0.75rem;
            font-style: italic;
            text-align: center;
            max-width: 280px;
        }

        .start-overlay .music-hint {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2rem;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
        }

        .start-overlay .music-hint .material-symbols-outlined {
            font-size: 18px;
        }

        @keyframes overlayPulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.3);
            }

            50% {
                box-shadow: 0 0 0 20px rgba(255, 255, 255, 0);
            }
        }
    </style>
</head>

<body class="font-sans overflow-x-hidden">
    <!-- START OVERLAY - User must tap to begin -->
    <div id="start-overlay" class="start-overlay">
        <button class="start-circle" id="start-btn">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
        </button>
        <h2>Tap to Begin</h2>
        <p>Experience the cinematic journey with music</p>
        <div class="music-hint">
            <span class="material-symbols-outlined">music_note</span>
            <span>Sound will play</span>
        </div>
    </div>

    <div class="grain-overlay"></div>

    <!-- Floating Particles Background (Generated via JS) -->
    <div id="particle-container"></div>

    <!-- Ethereal Rose Petals Container -->
    <div id="petal-container"></div>

    <!-- Main Infinity Scroll Container -->
    <main id="infinity-scroll-container" class="relative min-h-screen w-full">

        <!-- Hero Header (Fixed Position) -->
        <header
            class="sticky top-0 left-0 w-full z-40 bg-gradient-to-b from-rose-50/70 to-transparent backdrop-blur-[2px] py-4">
            <div class="max-w-2xl mx-auto px-6 text-center">
                <!-- Brand Mark -->
                <div class="flex items-center justify-center gap-2 text-primary/40 mb-4">
                    <span class="material-symbols-outlined scale-75"
                        style="font-variation-settings: 'FILL' 1, 'wght' 700;">
                        diamond
                    </span>
                    <span class="text-[10px] font-sans uppercase tracking-[0.3em] font-bold">
                        FOR YOU, ALWAYS
                    </span>
                </div>

                <!-- Main Title -->
                <h1 class="font-display text-4xl md:text-5xl text-primary mb-3 tracking-tight">
                    I love you because...
                </h1>

                <!-- Subtitle -->
                <p class="font-sans italic text-rose-900/60 text-lg">
                    An endless collection of reasons
                </p>

                <!-- Scroll Indicator (Fades out after user scrolls) -->
                <div id="scroll-hint" class="scroll-indicator mt-6 text-rose-400/60 transition-opacity duration-500">
                    <span class="material-symbols-outlined text-3xl">
                        expand_more
                    </span>
                </div>
            </div>
        </header>

        <!-- Dynamic Content Area (Infinite Scroll) -->
        <section id="reasons-container" class="max-w-2xl mx-auto px-6 pb-32 space-y-12">
            <!-- Content will be dynamically generated here -->
        </section>



        <!-- Progress Counter (Bottom Right) -->
        <div
            class="fixed bottom-8 right-8 z-40 bg-white/70 backdrop-blur-md px-4 py-2 rounded-full border border-rose-200/40 shadow-lg">
            <span id="reason-counter" class="font-sans text-sm font-bold text-primary">
                1
            </span>
            <span class="font-sans text-xs text-rose-900/60 ml-1">
                reasons
            </span>
        </div>

        <!-- Auto Scroll Button (Bottom Left) -->
        <button id="toggle-auto-scroll" class="auto-scroll-btn">
            <span class="material-symbols-outlined">play_arrow</span>
            <span class="btn-text uppercase">Cinematic Mode</span>
        </button>

        <!-- Music Toggle Button (Top Right) -->
        <button id="toggle-infinity-music" class="music-toggle-btn" title="Toggle Music">
            <span class="material-symbols-outlined">music_off</span>
        </button>

        <!-- Scroll Speed Control (Minimalist & Ultra-Transparent) -->
        <div id="speed-control-container"
            class="fixed bottom-20 left-6 z-50 bg-white/10 backdrop-blur-[2px] p-2 px-3 rounded-full border border-white/10 transition-all duration-300 opacity-0 pointer-events-none hover:bg-white/30 hover:backdrop-blur-md group">
            <input type="range" id="scroll-speed" min="5" max="100" value="30"
                class="w-20 md:w-24 h-1 bg-rose-100/20 rounded-lg appearance-none cursor-pointer accent-rose-500/40 focus:outline-none group-hover:accent-rose-500">
            <div class="flex items-center gap-2">
                <span
                    class="text-[7px] font-bold text-primary/30 uppercase tracking-wider group-hover:text-primary/60">Speed</span>
                <span id="speed-value"
                    class="text-[9px] font-display text-primary/40 font-bold group-hover:text-primary">1.2x</span>
            </div>
        </div>
    </main>

    <!-- Load Data Directly with Cache Busting to ensure freshness -->
    <script>
        document.write('<script src="data.js?v=' + Date.now() + '"><\/script>');
    </script>

    <!-- JavaScript: Infinite Scroll Logic with Virtual DOM Recycling -->
    <script>
        // ========================================
        // CONFIGURATION
        // ========================================

        /**
         * DATA SOURCE:
         * 1. Prioritizes local CONFIG (from data.js script above)
         * 2. Overwrites with localStorage if available (Admin Panel changes)
         * 3. Handles window messages for live updates (Admin Preview)
         */
        const LS_KEY = 'valentine_admin_v2';

        // ✅ FIX: Use Parent's Reactive CONFIG if available, else local
        let parentConfig = {};
        try {
            // Check for safeGetConfig first (Claude fix)
            if (window.parent && typeof window.parent.safeGetConfig === 'function') {
                parentConfig = window.parent.safeGetConfig();
                console.log('[Config] Using parent safeGetConfig()');
            } else if (window.parent && window.parent.CONFIG) {
                parentConfig = window.parent.CONFIG;
                console.log('[Config] Fallback to parent window.CONFIG');
            } else {
                parentConfig = (typeof CONFIG !== 'undefined') ? CONFIG : {};
            }
        } catch (e) {

        // ========================================
        // RANDOMIZER LOGIC
        // ========================================

        /**
         * Fisher-Yates Shuffle Algorithm
         * Ensures each reason appears once before repeating
         */
        class ReasonRandomizer {
            constructor() {
                this.pools = {
                    generic: [...REASONS_LIBRARY.generic],
                    personal: [...REASONS_LIBRARY.personal],
                    poetic: [...REASONS_LIBRARY.poetic]
                };
                this.shuffleAll();
            }

            shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            shuffleAll() {
                Object.keys(this.pools).forEach(key => {
                    this.shuffleArray(this.pools[key]);
                });
            }

            getReason() {
                // Weighted selection: 50% generic, 30% personal, 20% poetic
                const rand = Math.random();
                let pool;

                if (rand < 0.5) {
                    pool = 'generic';
                } else if (rand < 0.8) {
                    pool = 'personal';
                } else {
                    pool = 'poetic';
                }

                // Get from pool
                if (this.pools[pool].length === 0) {
                    // Reshuffle when depleted
                    this.pools[pool] = [...REASONS_LIBRARY[pool]];
                    this.shuffleArray(this.pools[pool]);
                }

                return this.pools[pool].pop();
            }
        }

        const randomizer = new ReasonRandomizer();

        function generateContent(count = BATCH_SIZE) {
            if (isGenerating) return;
            isGenerating = true;

            const container = document.getElementById('reasons-container');
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < count; i++) {
                reasonCount++;

                // NEW: Check for video memory milestone (passing fragment instead of container)
                checkVideoMilestone(reasonCount, fragment);

                // Use dynamic interval from config
                if (reasonCount % PHOTO_INTERVAL === 0) {
                    const photo = PHOTO_MEMORIES[photoIndex % PHOTO_MEMORIES.length];
                    if (photo) {
                        const photoEl = createPhotoElement(photo, i);
                        fragment.appendChild(photoEl);
                        generatedElements.push(photoEl);
                        photoIndex++;
                    } else {
                        // Fallback to reason if photo missing
                        const reason = randomizer.getReason();
                        const reasonEl = createReasonElement(reason, i);
                        fragment.appendChild(reasonEl);
                        generatedElements.push(reasonEl);
                    }
                } else {
                    const reason = randomizer.getReason();
                    const reasonEl = createReasonElement(reason, i);
                    fragment.appendChild(reasonEl);
                    generatedElements.push(reasonEl);
                }
            }

            container.appendChild(fragment);
            updateCounter();



            // Clean up old elements (Virtual DOM Recycling)
            requestAnimationFrame(() => {
                cleanupElements();
                isGenerating = false;
            });

        // ========================================
        // DOM RECYCLING (Performance Optimization)
        // ========================================

        function cleanupElements() {
            if (generatedElements.length <= MAX_DOM_ELEMENTS) return;

            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const viewportHeight = window.innerHeight;
            const topThreshold = scrollTop - VIEWPORT_BUFFER;

            // Remove elements that are far above the viewport
            generatedElements = generatedElements.filter(element => {
                if (!element.parentNode) return false;

                const rect = element.getBoundingClientRect();
                const elementTop = rect.top + scrollTop;

                if (elementTop < topThreshold) {
                    element.remove();
                    return false;
                }

                return true;
            });
        }

        // ========================================

        // ========================================

        function handleScroll() {
            const scrollY = window.scrollY;
            const windowHeight = window.innerHeight;

            // Track visible reason for Color Journey
            updateVisibleReasonTracking();

            // Hide scroll hint after first scroll
            if (scrollY > 100) {
                const hint = document.getElementById('scroll-hint');
                if (hint) hint.style.opacity = '0';
            }

            // Trigger new content generation when near bottom
            if (scrollY + windowHeight >= documentHeight - 800) {
                generateContent(BATCH_SIZE);
            }

            // Throttled cleanup check
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                cleanupElements();
            }, 200);

            lastScrollY = scrollY;
        }

        let currentVisibleIndex = 0;
        function updateVisibleReasonTracking() {
            const reasons = document.querySelectorAll('.reason-item');
            const viewportMiddle = window.scrollY + (window.innerHeight / 2);

            let closestIndex = currentVisibleIndex;
            let minDistance = Infinity;

            reasons.forEach(reason => {
                const rect = reason.getBoundingClientRect();
                const reasonMiddle = rect.top + window.scrollY + (rect.height / 2);
                const distance = Math.abs(viewportMiddle - reasonMiddle);

                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = parseInt(reason.dataset.index) || closestIndex;
                }
            });

            if (closestIndex !== currentVisibleIndex) {
                currentVisibleIndex = closestIndex;
                updateColorJourney();
                updateCounter(currentVisibleIndex);
            }

        // ========================================

        function performAutoScroll() {
            if (!isAutoScrolling) return;

            window.scrollBy(0, parseFloat(scrollSpeed));

            scrollRequest = requestAnimationFrame(performAutoScroll);

        let lastAutoScrollToggle = 0;
        let autoScrollGracePeriod = false;
        let autoScrollManuallyStopped = false; // Add new flag

        function toggleAutoScroll(forceState) {
            const now = Date.now();
            if (now - lastAutoScrollToggle < 500 && forceState === undefined) return;

            // If forceState is provided, ensure we only act if different
            if (forceState !== undefined && isAutoScrolling === forceState) return;

            const btn = document.getElementById('toggle-auto-scroll');
            const icon = btn.querySelector('.material-symbols-outlined');
            const text = btn.querySelector('.btn-text');

            isAutoScrolling = (forceState !== undefined) ? forceState : !isAutoScrolling;
            lastAutoScrollToggle = now;

            if (isAutoScrolling) {
                btn.classList.add('active');
                icon.textContent = 'pause';
                text.textContent = 'Pause Mode';
                autoScrollManuallyStopped = false; // Reset when started

                // Show speed control
                const speedCtrl = document.getElementById('speed-control-container');
                if (speedCtrl) {
                    speedCtrl.classList.remove('opacity-0', 'pointer-events-none');
                }

                // Set grace period to ignore interaction for 3s (increased for mobile)
                autoScrollGracePeriod = true;
                setTimeout(() => autoScrollGracePeriod = false, 3000); // Extended to 3 seconds

                performAutoScroll();
            } else {
                btn.classList.remove('active');
                icon.textContent = 'play_arrow';
                text.textContent = 'Cinematic Mode';

                if (forceState === false) {
                    autoScrollManuallyStopped = true; // Use this to prevent auto-restart
                }

                // Hide speed control
                const speedCtrl = document.getElementById('speed-control-container');
                if (speedCtrl) {
                    speedCtrl.classList.add('opacity-0', 'pointer-events-none');
                }

                cancelAnimationFrame(scrollRequest);
            }
        }

        // Initialize Auto Scroll
        function initAutoScroll() {
            const btn = document.getElementById('toggle-auto-scroll');
            if (!btn) return;

            btn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggleAutoScroll();
            });

            // Stop auto-scroll on manual touch/wheel to give control back to user
            window.addEventListener('wheel', (e) => {
                if (isAutoScrolling && !autoScrollGracePeriod && !e.target.closest('#toggle-auto-scroll')) {
                    toggleAutoScroll(false); // Force stop
                }
            }, { passive: true });

            // Smart Touch Detection for Mobile
            let lastTouchTime = 0;
            let touchStartY = 0;

            window.addEventListener('touchstart', (e) => {
                const now = Date.now();

                // Debounce rapid touches
                if (now - lastTouchTime < 300) return;
                lastTouchTime = now;

                // Ignore if clicking UI elements
                if (e.target.closest('#toggle-auto-scroll') || e.target.closest('#speed-control-container')) return;

                touchStartY = e.touches[0].clientY;

                // Don't immediately stop - wait to see if it's intentional scroll
                if (isAutoScrolling && !autoScrollGracePeriod) {
                    // Set flag for touchmove to check
                    window.pendingTouchCheck = true;
                }
            }, { passive: true });

            // Add touchmove listener to detect actual scroll intent
            window.addEventListener('touchmove', (e) => {
                if (window.pendingTouchCheck) {
                    const touchMoveY = e.touches[0].clientY;
                    const deltaY = Math.abs(touchStartY - touchMoveY);

                    // If user moved finger more than 30px, it's intentional scroll
                    if (deltaY > 30) {
                        toggleAutoScroll(false);
                        window.pendingTouchCheck = false;
                        console.log('[AutoScroll] Stopped by user touch scroll');
                    }
                }
            }, { passive: true });

            window.addEventListener('touchend', () => {
                window.pendingTouchCheck = false;
            }, { passive: true });

            // Initialize Speed Control
            const speedInput = document.getElementById('scroll-speed');
            const speedValueDisplay = document.getElementById('speed-value');
            if (speedInput) {
                speedInput.addEventListener('input', (e) => {
                    const val = parseInt(e.target.value);
                    // Map 5-100 to 0.2 - 4.0 range
                    scrollSpeed = (val / 25).toFixed(2);
                    if (speedValueDisplay) speedValueDisplay.textContent = scrollSpeed + 'x';
                });
            }
        }

        }

        // ========================================
        // ETHEREAL ROSE PETALS (Parallax)
        // ========================================

        const petalElements = [];

        function createPetalSVG(color) {
            return `<svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
                <path d="M25 5 C35 15, 45 25, 25 45 C5 25, 15 15, 25 5" fill="${color}" />
            </svg>`;
        }

        function initPetals() {
            const container = document.getElementById('petal-container');
            if (!container) return;

            const petalConfigs = [
                // Far layer (small, blurry, slow parallax)
                { layer: 'far', size: 20, count: 5, speed: 0.02, colors: ['#fecdd3', '#fda4af'] },
                // Mid layer (medium)
                { layer: 'mid', size: 35, count: 4, speed: 0.05, colors: ['#fb7185', '#f43f5e'] },
                // Near layer (large, very blurry, fast parallax)
                { layer: 'near', size: 80, count: 3, speed: 0.12, colors: ['#fda4af', '#fecdd3'] },
            ];

            petalConfigs.forEach(config => {
                for (let i = 0; i < config.count; i++) {
                    const petal = document.createElement('div');
                    petal.className = `rose-petal petal-layer-${config.layer}`;
                    petal.style.width = `${config.size}px`;
                    petal.style.height = `${config.size}px`;
                    petal.style.left = `${Math.random() * 100}%`;
                    petal.style.top = `${Math.random() * 100}%`;
                    petal.style.animation = `petalDrift ${8 + Math.random() * 6}s ease-in-out infinite`;
                    petal.style.animationDelay = `${Math.random() * 5}s`;

                    const color = config.colors[Math.floor(Math.random() * config.colors.length)];
                    petal.innerHTML = createPetalSVG(color);

                    container.appendChild(petal);
                    petalElements.push({ el: petal, speed: config.speed, baseTop: parseFloat(petal.style.top) });
                }
            });
        }

        function updatePetalsParallax() {
            const scrollY = window.scrollY;
            petalElements.forEach(petal => {
                const offset = scrollY * petal.speed;
                petal.el.style.transform = `translateY(${offset}px)`;
            });
        }

        // ========================================
        // INITIALIZATION
        // ========================================

        document.addEventListener('DOMContentLoaded', () => {
            console.log('🌸 Infinity Scroll Initialized');

            // Apply theme from CONFIG first
            applyThemeFromConfig();

            // Generate initial content (1.5x batch size for initial fill)
            generateContent(Math.floor(BATCH_SIZE * 1.5));

            // Initialize particles
            initParticles();

            // Initialize Rose Petals
            initPetals();

            // Initialize Auto Scroll
            initAutoScroll();

            // Attach scroll listener with passive flag for better performance
            window.addEventListener('scroll', (e) => {
                handleScroll();
                updatePetalsParallax();
                updateColorJourney(); // Emotional Color Journey
            }, { passive: true });

            // Initialize Music System
            initInfinityMusic();

            // Retry autoplay if blocked
            let autoplayRetryCount = 0;
            const maxAutoplayRetries = 3;

            function retryAutoplay() {
                if (autoplayRetryCount >= maxAutoplayRetries) {
                    console.log('[Music] Max autoplay retries reached, waiting for user interaction');
                    return;
                }

                if (!infinityAudio || isInfinityMusicPlaying) return;

                autoplayRetryCount++;
                console.log(`[Music] Retry autoplay attempt ${autoplayRetryCount}/${maxAutoplayRetries}`);

                infinityAudio.play()
                    .then(() => {
                        console.log('[Music] Retry successful!');
                        const btn = document.getElementById('toggle-infinity-music');
                        const icon = btn.querySelector('.material-symbols-outlined');
                        btn.classList.add('playing');
                        icon.textContent = 'music_note';
                        isInfinityMusicPlaying = true;
                    })
                    .catch(() => {
                        console.log('[Music] Retry failed, will try again...');
                        setTimeout(retryAutoplay, 2000); // Retry after 2 seconds
                    });
            }

            // ========================================
            // START OVERLAY HANDLER
            // ========================================
            const startOverlay = document.getElementById('start-overlay');
            const startBtn = document.getElementById('start-btn');

            if (startOverlay && startBtn) {
                // Handler for start button
                const handleStart = () => {
                    console.log('[Start] User tapped start button');

                    // Hide overlay with transition
                    startOverlay.classList.add('hidden');

                    // 1. Tell parent to FADE OUT its music
                    stopParentMusic(); // This sends STOP_MUSIC message
                    console.log('[Music] Sent fade out request to parent');

                    // 2. Wait for parent fade out, then start local music with fade in
                    setTimeout(() => {
                        if (infinityAudio && INFINITY_AUDIO_SRC) {
                            infinityAudio.play().then(() => {
                                console.log('[Music] Starting Infinity music with fade in');
                                fadeInAudio(infinityAudio, 2000); // 2 second fade in
                                updateInfinityMusicUI(true);
                            }).catch(e => {
                                console.error('[Music] Play failed:', e);
                            });
                        }
                    }, 1000); // Wait 1 second for parent to fade out

                    // 3. Start auto-scroll after music transition
                    setTimeout(() => {
                        if (!isAutoScrolling) {
                            toggleAutoScroll(true);
                            console.log('[AutoScroll] Started via overlay');
                        }
                    }, 1500);
                };

                startBtn.addEventListener('click', handleStart);
                startBtn.addEventListener('touchend', handleStart);

                // Also handle tap anywhere on overlay
                startOverlay.addEventListener('click', (e) => {
                    if (e.target === startOverlay) {
                        handleStart();
                    }
                });
            }

            // Performance monitoring removed for production
        });

        // ========================================
        // THEME APPLICATION SYSTEM
        // ========================================

        function applyThemeFromConfig() {
            const theme = parentConfig.theme || {};
            console.log('[Theme] CONFIG loaded:', JSON.stringify(theme));

            // Apply background color
            if (theme.backgroundColor) {
                // Convert solid color to gradient
                const baseColor = theme.backgroundColor;
                const gradient = generateGradient(baseColor);

                // Use CSS variable to override
                document.documentElement.style.setProperty('--page-bg', gradient);
                console.log(`[Theme] Applied background color: ${baseColor}`);
                console.log(`[Theme] Generated gradient: ${gradient}`);
            } else {
                console.log('[Theme] No backgroundColor found in config');
            }

            // Apply background image if exists
            if (theme.backgroundImage) {
                document.body.style.backgroundImage = `url('${theme.backgroundImage}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                console.log(`[Theme] Applied background image: ${theme.backgroundImage}`);
            }

            // Apply fonts
            if (theme.fontDisplay) {
                document.documentElement.style.setProperty('--font-display', theme.fontDisplay);
            }
            if (theme.fontSans) {
                document.documentElement.style.setProperty('--font-sans', theme.fontSans);
            }
        }

        function generateGradient(hexColor) {
            // Convert hex to RGB
            const r = parseInt(hexColor.slice(1, 3), 16);
            const g = parseInt(hexColor.slice(3, 5), 16);
            const b = parseInt(hexColor.slice(5, 7), 16);

            // Create lighter and slightly different tints for gradient
            const lighterR = Math.min(255, r + 30);
            const lighterG = Math.min(255, g + 30);
            const lighterB = Math.min(255, b + 30);

            const warmR = Math.min(255, r + 15);
            const warmG = Math.min(255, g + 10);
            const warmB = Math.max(0, b - 10);

            const coolR = Math.max(0, r - 20);
            const coolG = Math.max(0, g - 10);
            const coolB = Math.min(255, b + 20);

            return `linear-gradient(135deg, 
                rgb(${lighterR}, ${lighterG}, ${lighterB}) 0%, 
                rgb(${warmR}, ${warmG}, ${warmB}) 50%, 
                rgb(${coolR}, ${coolG}, ${coolB}) 100%)`;
        }

        // ========================================
        // EMOTIONAL COLOR JOURNEY SYSTEM
        // ========================================

        // Store the base theme color for blending
        let baseThemeColor = null;
        let lastJourneyPhase = 0;

        function initColorJourney() {
            const theme = parentConfig.theme || {};
            if (theme.backgroundColor) {
                baseThemeColor = hexToRgb(theme.backgroundColor);
                console.log('[ColorJourney] Base theme color:', baseThemeColor);
            }
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }

        function rgbToString(rgb) {
            return `rgb(${Math.round(rgb.r)}, ${Math.round(rgb.g)}, ${Math.round(rgb.b)})`;
        }

        function blendColors(color1, color2, factor) {
            return {
                r: color1.r + (color2.r - color1.r) * factor,
                g: color1.g + (color2.g - color1.g) * factor,
                b: color1.b + (color2.b - color1.b) * factor
            };
        }

        function updateColorJourney() {
            if (!baseThemeColor) {
                initColorJourney();
                if (!baseThemeColor) return;
            }

            const count = currentVisibleIndex;

            // Define atmospheric colors for each phase (Aesthetic Warmth Journey)
            const atmospheres = {
                morning: baseThemeColor,
                champagne: { r: 255, g: 245, b: 230 }, // Soft Creamy Warmth
                roseGold: { r: 245, g: 195, b: 185 },  // Romantic Peachy Glow
                duskyRose: { r: 220, g: 150, b: 145 }, // Muted Sunset Pink
                warmNight: { r: 80, g: 50, b: 55 }     // Deep Romantic Burgundy
            };

            let gradient;
            let currentPhase;

            if (count <= 25) {
                // Phase 1: Morning (1-25) - Original theme
                currentPhase = 1;
                gradient = generateGradient(parentConfig.theme.backgroundColor);
            } else if (count <= 50) {
                // Phase 2: Champagne Heat (26-50)
                currentPhase = 2;
                const progress = (count - 25) / 25;
                const blended = blendColors(baseThemeColor, atmospheres.champagne, progress * 0.4);
                gradient = generateAtmosphericGradient(blended, 'warm');
            } else if (count <= 75) {
                // Phase 3: Rose Gold Glow (51-75)
                currentPhase = 3;
                const progress = (count - 50) / 25;
                const base = blendColors(baseThemeColor, atmospheres.champagne, 0.4);
                const blended = blendColors(base, atmospheres.roseGold, progress * 0.6);
                gradient = generateAtmosphericGradient(blended, 'gold');
            } else {
                // Phase 4: Dusky Sunset (76+)
                currentPhase = 4;
                const progress = Math.min((count - 75) / 50, 1);
                const base = blendColors(baseThemeColor, atmospheres.roseGold, 0.6);
                const blended = blendColors(base, atmospheres.duskyRose, progress * 0.7);
                gradient = generateAtmosphericGradient(blended, 'sunset');
            }

            // Only update if phase changed (for performance)
            if (currentPhase !== lastJourneyPhase || count % 3 === 0) {
                document.documentElement.style.setProperty('--page-bg', gradient);
                lastJourneyPhase = currentPhase;

                if (count % 10 === 0) {
                    console.log(`[ColorJourney] Phase ${currentPhase}, Reason ${count}`);
                }
            }
        }

        function generateAtmosphericGradient(baseColor, mood) {
            let color1, color2, color3;

            if (mood === 'warm') {
                color1 = { r: baseColor.r + 5, g: baseColor.g + 5, b: baseColor.b };
                color2 = { r: baseColor.r, g: baseColor.g, b: baseColor.b - 5 };
                color3 = { r: baseColor.r - 5, g: baseColor.g - 5, b: baseColor.b + 5 };
            } else if (mood === 'gold') {
                color1 = { r: baseColor.r + 15, g: baseColor.g + 10, b: baseColor.b };
                color2 = { r: baseColor.r + 5, g: baseColor.g, b: baseColor.b - 10 };
                color3 = { r: baseColor.r - 10, g: baseColor.g - 5, b: baseColor.b + 5 };
            } else if (mood === 'sunset') {
                color1 = { r: baseColor.r + 20, g: baseColor.g + 5, b: baseColor.b + 5 };
                color2 = { r: baseColor.r + 10, g: baseColor.g - 10, b: baseColor.b - 5 };
                color3 = { r: baseColor.r - 15, g: baseColor.g - 15, b: baseColor.b + 10 };
            } else {
                color1 = color2 = color3 = baseColor;
            }

            // Clamp values
            [color1, color2, color3].forEach(c => {
                c.r = Math.max(0, Math.min(255, c.r));
                c.g = Math.max(0, Math.min(255, c.g));
                c.b = Math.max(0, Math.min(255, c.b));
            });

            return `linear-gradient(135deg, ${rgbToString(color1)} 0%, ${rgbToString(color2)} 50%, ${rgbToString(color3)} 100%)`;
        }

        // ============================================================
        // AUDIO UTILITIES (Ported from main app for mobile support)
        // ============================================================
        async function fetchMediaBlob(url, attempt = 1) {
            if (!url) return '';
            const maxAttempts = 3;

            try {
                if (url.startsWith('data:')) return url;

                // Add cache busting shield
                const shieldedUrl = url + (url.includes('?') ? '&' : '?') + 'shield=' + Date.now() + '_' + attempt;
                console.log(`[Media] Fetching (${attempt}/${maxAttempts}): ${url.substring(0, 40)}...`);

                const response = await fetch(shieldedUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const blob = await response.blob();
                const type = (url.toLowerCase().endsWith('.mp3') || url.toLowerCase().endsWith('.dat'))
                    ? 'audio/mpeg' : blob.type;

                const audioBlob = new Blob([blob], { type: type });
                return URL.createObjectURL(audioBlob);
            } catch (e) {
                console.warn(`[Media] Attempt ${attempt} failed:`, e.message);
                if (attempt < maxAttempts) {
                    await new Promise(r => setTimeout(r, 1000 * attempt));
                    return fetchMediaBlob(url, attempt + 1);
                }
                console.error("[Media] Final failure for:", url);
                return url; // Final fallback
            }
        }

        // ========================================
        // INFINITY MUSIC SYSTEM
        // ========================================

        async function initInfinityMusic() {
            console.log('[Music] Initializing music system...');

            // ✅ FIX: DO NOT stop parent music here. 
            // It should only stop when handleStart is triggered by user tap.
            // stopParentMusic(); ❌ Removed

            if (!INFINITY_AUDIO_SRC) {
                console.warn('[Music] No infinity music source found in config');
                const musicBtn = document.getElementById('toggle-infinity-music');
                if (musicBtn) musicBtn.style.display = 'none';
                return;
            }

            // Create audio element with basic settings
            infinityAudio = new Audio();
            infinityAudio.loop = true;
            infinityAudio.volume = 0; // Start at 0 for fade-in
            infinityAudio.preload = 'auto';

            // Use fetchMediaBlob to handle Cloudflare/Mobile issues
            try {
                const blobUrl = await fetchMediaBlob(INFINITY_AUDIO_SRC);
                infinityAudio.src = blobUrl;
                console.log('[Music] Audio source set to blob URL');
            } catch (e) {
                console.error('[Music] Blob failed, falling back to raw src');
                infinityAudio.src = INFINITY_AUDIO_SRC;
            }

            // Setup toggle button
            const btn = document.getElementById('toggle-infinity-music');
            if (btn) btn.addEventListener('click', toggleInfinityMusic);

            // NOTE: Parent music keeps playing until user taps the start overlay
            // The overlay handler will call stopParentMusic() when user taps

            console.log('[Music] Infinity music initialized (waiting for user to tap overlay to transition)');
        }

        function isPageActuallyVisible() {
            try {
                // If same-origin, we can check directly
                const parentSection = window.parent.document.getElementById('page-10');
                if (parentSection && !parentSection.classList.contains('hidden')) {
                    return true;
                }
            } catch (e) {
                console.log('[Music] Cannot access parent DOM, using fallback detection');

                // FIX: Optimistic visibility for mobile
                if (document.readyState === 'complete' && !document.hidden) {
                    return true;
                }
            }

            // If we are Top level (not in iframe), we are visible
            if (window.self === window.top) {
                return true;
            }

            // Visibility API check
            return document.visibilityState === 'visible';
        }

        function forceStopParentMusicOnLoad() {
            console.log('[Music] Proactive stopParentMusic on load');
            stopParentMusic();
        }

        let startAutoplayTriggered = false;
        function attemptAutoplay() {
            if (!infinityAudio || isInfinityMusicPlaying || startAutoplayTriggered) return;
            startAutoplayTriggered = true;

            const btn = document.getElementById('toggle-infinity-music');
            if (btn) btn.classList.add('loading'); // Optional loading state

            console.log('[Music] Attempting autoplay...');

            // Mobile workaround: Try to play immediately (some browsers block if delayed too long)
            infinityAudio.play().then(() => {
                // Success! Now fade in
                fadeInAudio(infinityAudio, 2500);
                updateInfinityMusicUI(true);
                console.log('[Music] Autoplay started successfully');
            }).catch(e => {
                console.log('[Music] Autoplay blocked or failed, waiting for interaction');
                startAutoplayTriggered = false; // Allow retry
                updateInfinityMusicUI(false);

                // One-time interaction fallback
                const kickstart = () => {
                    if (!isInfinityMusicPlaying) {
                        toggleInfinityMusic();
                        document.removeEventListener('touchstart', kickstart);
                        document.removeEventListener('click', kickstart);
                    }
                };
                document.addEventListener('touchstart', kickstart, { once: true });
                document.addEventListener('click', kickstart, { once: true });
            });
        }

        function updateInfinityMusicUI(playing) {
            const btn = document.getElementById('toggle-infinity-music');
            if (!btn) return;
            const icon = btn.querySelector('.material-symbols-outlined');

            isInfinityMusicPlaying = playing;
            if (playing) {
                btn.classList.add('playing');
                if (icon) icon.textContent = 'music_note';
            } else {
                btn.classList.remove('playing');
                if (icon) icon.textContent = 'music_off';
            }
        }

        let localFadeInterval = null;
        function fadeInAudio(audio, duration) {
            if (localFadeInterval) clearInterval(localFadeInterval);

            audio.volume = 0;
            const targetVolume = 0.5;
            const speed = 50;
            const step = targetVolume / (duration / speed);

            localFadeInterval = setInterval(() => {
                if (audio.volume < targetVolume - step) {
                    audio.volume += step;
                } else {
                    audio.volume = targetVolume;
                    clearInterval(localFadeInterval);
                    localFadeInterval = null;
                }
            }, speed);
        }

        function fadeOutLocalAudio(audio, duration, callback) {
            if (!audio || audio.paused) {
                if (callback) callback();
                return;
            }
            if (localFadeInterval) clearInterval(localFadeInterval);

            const startVolume = audio.volume;
            const speed = 50;
            const step = startVolume / (duration / speed);

            localFadeInterval = setInterval(() => {
                if (audio.volume > step) {
                    audio.volume -= step;
                } else {
                    audio.volume = 0;
                    audio.pause();
                    audio.volume = startVolume;
                    clearInterval(localFadeInterval);
                    localFadeInterval = null;
                    if (callback) callback();
                }
            }, speed);
        }

        function stopParentMusic() {
            console.log('[Music] Requesting parent music to fade out...');
            try {
                // Try to access parent's bgMusic and fade it out
                if (window.parent && window.parent.bgMusic) {
                    if (typeof window.parent.fadeOutAudio === 'function') {
                        window.parent.fadeOutAudio(window.parent.bgMusic, 2000);
                    } else {
                        window.parent.bgMusic.pause();
                    }
                }
            } catch (e) {
                console.log('[Music] Could not access parent music directly (cross-origin)');
            }

            // Also send message to parent (more robust)
            try {
                window.parent.postMessage({ type: 'STOP_MUSIC' }, '*');
            } catch (e) {
                // Ignore if postMessage fails
            }
        }

        function toggleInfinityMusic() {
            if (!infinityAudio) return;

            if (isInfinityMusicPlaying) {
                fadeOutLocalAudio(infinityAudio, 1500, () => {
                    updateInfinityMusicUI(false);
                });
            } else {
                // For manual start, try to play immediately
                infinityAudio.play().then(() => {
                    fadeInAudio(infinityAudio, 2000);
                    updateInfinityMusicUI(true);
                }).catch(e => {
                    console.log('[Music] Manual play blocked');
                });
            }
        }

        // ========================================
        // EMOTIONAL COLOR JOURNEY SYSTEM
        // (Remove this entire section to revert)
        // ========================================

        function updateAtmosphere() {
            const atmosphereEl = document.getElementById('atmosphere-overlay');
            const vignetteEl = document.getElementById('vignette-overlay');

            if (!atmosphereEl || !vignetteEl) return;

            // Phase thresholds based on reason count
            const count = reasonCount;

            // Debug log every 5 reasons
            if (count % 5 === 0) {
                console.log(`[Atmosphere] Reason count: ${count}`);
            }

            // Phase 1: Morning (Fresh, Bright) - Reasons 1-10
            // Phase 2: Golden Hour (Warm, Romantic) - Reasons 10-25
            // Phase 3: Twilight (Deep, Emotional) - Reasons 25-40
            // Phase 4: Night (Intimate, Starlit) - Reasons 40+

            let atmosphereColor, atmosphereOpacity, vignetteOpacity;

            if (count <= 10) {
                // Morning - No overlay, keep original theme
                atmosphereOpacity = 0;
                vignetteOpacity = 0;
            } else if (count <= 25) {
                // Golden Hour - Warm orange tint
                const progress = (count - 10) / 15; // 0 to 1
                atmosphereColor = `rgba(255, 160, 80, 0.35)`; // Solid warm orange
                atmosphereOpacity = 0.4 + 0.4 * progress;
                vignetteOpacity = 0.15 * progress;
            } else if (count <= 40) {
                // Twilight - Purple/blue tint
                const progress = (count - 25) / 15; // 0 to 1
                atmosphereColor = `rgba(100, 60, 150, 0.4)`; // Purple twilight
                atmosphereOpacity = 0.8 + 0.15 * progress;
                vignetteOpacity = 0.2 + 0.2 * progress;
            } else {
                // Night - Deep blue with stars feel
                const extraProgress = Math.min((count - 40) / 20, 1); // Cap at 60
                atmosphereColor = `rgba(20, 30, 70, 0.5)`; // Deep night blue
                atmosphereOpacity = 0.95;
                vignetteOpacity = 0.4 + 0.25 * extraProgress;
            }

            // Apply styles
            if (atmosphereColor) {
                atmosphereEl.style.background = atmosphereColor;
            }
            atmosphereEl.style.opacity = atmosphereOpacity;
            vignetteEl.style.opacity = vignetteOpacity;
        }
    </script>

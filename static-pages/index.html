<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Key to My Heart</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@1,600&family=Inter:wght@300;400;600&family=Dancing+Script:wght@700" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <script src="data.js"></script>
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        .brand-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            opacity: 0.8;
            font-family: var(--font-sans);
            font-size: 0.72rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 700;
        }
        .glass-card {
            width: 100%;
            background: rgba(255,255,255,0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.85);
            border-radius: 1.5rem;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 2.5rem;
        }
        .icon-area {
            color: var(--rosegold);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .icon-area .main-icon { font-size: 3rem; font-variation-settings: 'FILL' 0, 'wght' 200; }
        .icon-area .sub-icon { font-size: 1.25rem; opacity: 0.6; margin-top: -0.5rem; }

        .login-title {
            font-family: var(--font-display);
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
            margin-bottom: 0.75rem;
        }
        .login-instruction {
            font-family: var(--font-sans);
            font-size: 0.875rem;
            color: var(--primary);
            opacity: 0.65;
            letter-spacing: 0.05em;
        }
        .input-group {
            width: 100%;
            position: relative;
        }
        .login-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(126,12,35,0.25);
            padding: 1rem 2.5rem 1rem 0.5rem;
            font-size: 1.1rem;
            font-family: var(--font-sans);
            color: var(--primary);
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .login-input:focus { border-bottom-color: var(--primary); }
        .login-input::placeholder {
            color: rgba(126,12,35,0.35);
            font-style: italic;
            font-size: 0.95rem;
        }
        .lock-icon {
            position: absolute;
            right: 0.5rem;
            bottom: 1rem;
            font-size: 1rem;
            color: rgba(126,12,35,0.4);
            pointer-events: none;
        }
        .btn-wrapper { position: relative; }
        .btn-glow {
            position: absolute;
            inset: -4px;
            background: var(--primary);
            border-radius: 50%;
            filter: blur(8px);
            opacity: 0.2;
            transition: opacity 0.3s;
        }
        .btn-wrapper:hover .btn-glow { opacity: 0.45; }
        .login-btn {
            position: relative;
            width: 4.5rem;
            height: 4.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(126,12,35,0.35);
            transition: transform 0.2s, box-shadow 0.3s;
            overflow: hidden;
        }
        .login-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer-btn 3s infinite;
        }
        @keyframes shimmer-btn {
            0% { transform: translateX(-100%) skewX(-20deg); }
            100% { transform: translateX(100%) skewX(-20deg); }
        }
        .login-btn:hover { transform: scale(1.08); }
        .login-btn:active { transform: scale(0.95); }

        .error-message {
            font-family: var(--font-sans);
            font-size: 0.85rem;
            color: var(--primary);
            opacity: 0;
            transition: opacity 0.3s;
            min-height: 1.5rem;
        }
        .error-message.visible { opacity: 1; }

        /* Decorative blurs */
        .blur-deco {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .blur-1 {
            width: 300px; height: 300px;
            background: var(--rosegold);
            opacity: 0.07;
            top: -80px; left: -80px;
            filter: blur(80px);
        }
        .blur-2 {
            width: 400px; height: 400px;
            background: var(--primary);
            opacity: 0.07;
            bottom: -100px; right: -80px;
            filter: blur(100px);
        }

        @keyframes float-particle {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.25; }
            50% { transform: translateY(-25px) rotate(15deg); opacity: 0.5; }
        }

        @keyframes shake {
            10%, 90% { transform: translateX(-2px); }
            20%, 80% { transform: translateX(3px); }
            30%, 50%, 70% { transform: translateX(-5px); }
            40%, 60% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    </style>
</head>
<body>
    <div class="grain-overlay"></div>
    <div class="blur-deco blur-1"></div>
    <div class="blur-deco blur-2"></div>
    <div id="particles" style="position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;"></div>

    <div class="login-page" style="position:relative;z-index:2;">
        <div class="login-container">

            <div class="glass-card fade-in delay-1">
                <div class="icon-area">
                    <span class="material-symbols-outlined main-icon">flutter_dash</span>
                    <span class="material-symbols-outlined sub-icon">local_florist</span>
                </div>

                <div>
                    <h1 class="login-title" id="login-title">Key to My Heart</h1>
                    <p class="login-instruction" id="login-instruction">Masukkan kata sandimu</p>
                </div>

                <div class="input-group">
                    <input
                        id="login-input"
                        class="login-input"
                        type="password"
                        placeholder="*kunci rahasia...*"
                        autocomplete="off"
                    />
                    <span class="material-symbols-outlined lock-icon" id="lock-icon">lock_open</span>
                </div>

                <div class="btn-wrapper">
                    <div class="btn-glow"></div>
                    <button id="login-btn" class="login-btn" aria-label="Masuk">
                        <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;font-size:1.5rem">favorite</span>
                    </button>
                </div>

                <p class="error-message" id="error-msg"></p>
            </div>
        </div>
    </div>

    <script>
        // Ambil data dari window.VALENTINE_DATA (di-set oleh data.js)
        const DATA = window.VALENTINE_DATA || {};

        function applyTheme() {
            if (DATA.theme?.backgroundColor) {
                document.body.style.backgroundColor = DATA.theme.backgroundColor;
            }
        }

        function initParticles() {
            const type = DATA.theme?.particles || 'hearts';
            if (!type || type === 'none') return;
            const container = document.getElementById('particles');
            const emojis = type === 'hearts' ? ['❤️', '💕', '💗', '🌸'] : ['✨', '⭐', '🌟'];
            for (let i = 0; i < 16; i++) {
                const p = document.createElement('div');
                p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                p.style.cssText = `
                    position: absolute;
                    font-size: ${Math.random() * 12 + 8}px;
                    left: ${Math.random() * 100}%;
                    top: ${Math.random() * 100}%;
                    opacity: 0.25;
                    animation: float-particle ${Math.random() * 8 + 7}s ease-in-out ${Math.random() * 5}s infinite;
                    pointer-events: none;
                `;
                container.appendChild(p);
            }
        }

        function init() {
            applyTheme();
            initParticles();

            const loginCfg = DATA.login || {};

            document.getElementById('login-title').textContent = loginCfg.title || 'Key to My Heart';
            document.getElementById('login-instruction').textContent = loginCfg.instruction || 'Masukkan kata sandimu';
            document.getElementById('login-input').placeholder = loginCfg.placeholder || '*kunci rahasia...*';

            const input = document.getElementById('login-input');
            const btn = document.getElementById('login-btn');
            const errMsg = document.getElementById('error-msg');
            const lockIcon = document.getElementById('lock-icon');

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') tryLogin();
            });
            input.addEventListener('input', () => {
                errMsg.classList.remove('visible');
                lockIcon.textContent = input.value ? 'lock' : 'lock_open';
            });
            btn.addEventListener('click', tryLogin);

            function tryLogin() {
                const val = input.value.trim();
                const correct = loginCfg.password || '123';
                if (val === correct) {
                    lockIcon.textContent = 'lock';
                    btn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings:\'FILL\' 1;font-size:1.5rem;color:white">check_circle</span>';
                    btn.style.background = '#16a34a';
                    sessionStorage.setItem('valentine_unlocked', '1');
                    setTimeout(() => { window.location.href = './music.html'; }, 650);
                } else {
                    errMsg.textContent = loginCfg.errorMessage || 'Password salah, coba lagi!';
                    errMsg.classList.add('visible');
                    input.classList.add('shake');
                    lockIcon.textContent = 'lock_open';
                    setTimeout(() => input.classList.remove('shake'), 450);
                }
            }
        }

        init();
    </script>
</body>
</html>

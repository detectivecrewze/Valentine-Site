<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Invitation ❤️</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonts from main site -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;600&family=Dancing+Script:wght@700&family=Pacifico&family=Montserrat:wght@400;700&family=Great+Vibes&family=Cinzel:wght@700&family=Poppins:wght@300;400;600&family=Cormorant+Garamond:ital,wght@1,600&family=Lobster&family=Sacramento&family=Mrs+Saint+Delafield&display=swap"
        rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../assets/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="96x96" href="../assets/favicon/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="../assets/favicon/site.webmanifest">
</head>

<body>
    <div class="grain-overlay"></div>

    <div class="container">
        <div id="invitation-card" class="invitation-card">
            <h1 id="question">Would you like to be my Valentine?</h1>

            <div class="button-group">
                <button id="yes-btn" class="btn yes-button">Yes!</button>
                <button id="no-btn" class="btn no-button">No</button>
            </div>

            <div class="bear-container">
                <img id="bear-img" src="https://media.tenor.com/63IENW605s0AAAAi/dudu-twisting-dance.gif"
                    alt="Dancing Bear" class="dancing-bear">
            </div>
        </div>

        <div id="celebration" class="celebration hidden">
            <h1 id="success-message" class="success-message">Yay! ❤️</h1>
            <div class="bear-container">
                <img id="success-bear-img" src="https://media.tenor.com/0_jT8Pyszi8AAAAi/bubu-dudu-dudu-carry.gif"
                    alt="Happy Bear" class="dancing-bear">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
